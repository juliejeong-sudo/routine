<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What time do you...? 나의 하루 일과</title>
<style>
  :root {
    --bg: #fdf8ff;
    --ink: #3b3553;
    --muted: #7a7391;
    --pink: #ffd9e4;   --pink-dark: #e0799a;
    --blue: #d6efff;   --blue-dark: #5a9fd4;
    --green: #dcf5d9;  --green-dark: #5caf6a;
    --yellow: #fff3c4; --purple: #e9dcff; --purple-dark: #8b6fd6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); color: var(--purple-dark); }
  header p { margin: 6px 0 0; color: var(--muted); }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .pill {
    border: 2px solid transparent; background: #fff; color: var(--ink);
    font: inherit; font-size: 1rem; padding: 9px 18px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(80, 60, 120, 0.1);
  }
  .pill:hover { border-color: var(--purple); }
  .pill.active { background: var(--purple-dark); color: #fff; }
  .mode .pill.active { background: #ff9fb8; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  .card {
    background: #fff; border-radius: 22px; padding: 18px;
    box-shadow: 0 6px 18px rgba(80, 60, 120, 0.1);
    border-top: 10px solid var(--c);
    display: flex; flex-direction: column; gap: 10px;
  }
  .card[data-cat="textbook"] { --c: var(--pink);  --cd: var(--pink-dark); }
  .card[data-cat="korea"]    { --c: var(--blue);  --cd: var(--blue-dark); }
  .card[data-cat="world"]    { --c: var(--green); --cd: var(--green-dark); }
  .card-top { display: flex; align-items: center; gap: 14px; }
  .card-top svg { width: 86px; height: 86px; flex-shrink: 0; }
  .badge {
    display: inline-block; font-size: 0.8rem; padding: 3px 10px; border-radius: 999px;
    background: var(--c); color: var(--ink); margin-bottom: 4px;
  }
  .expr {
    display: block; font: inherit; font-size: 1.5rem; font-weight: bold; color: var(--cd);
    background: none; border: none; padding: 0; cursor: pointer; text-align: left;
  }
  .expr:hover { text-decoration: underline wavy; }
  .ko { color: var(--muted); font-size: 0.95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--yellow); border-radius: 10px; padding: 4px 10px; font-size: 0.9rem; }
  .chip.t { background: var(--purple); font-weight: bold; }
  .talk { background: #faf7ff; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .line { display: flex; align-items: flex-start; gap: 8px; }
  .who {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 0.8rem; font-weight: bold; color: #fff;
  }
  .who.q { background: var(--purple-dark); }
  .who.a { background: var(--cd); }
  .line .txt { flex: 1; font-size: 1.05rem; line-height: 1.4; }
  .line .txt small { display: block; color: var(--muted); font-size: 0.85rem; }
  .spk {
    flex-shrink: 0; border: none; background: #fff; border-radius: 50%;
    width: 34px; height: 34px; font-size: 1.05rem; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .spk:hover { background: var(--yellow); }

  /* 따라 말하기 체크 */
  .progress {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    margin: 0 auto 18px; font-size: 1.05rem;
  }
  .progress .count { background: #fff; padding: 8px 16px; border-radius: 999px; box-shadow: 0 2px 6px rgba(80, 60, 120, 0.1); }
  .progress .reset {
    font: inherit; font-size: 0.9rem; border: none; background: none; color: var(--muted);
    text-decoration: underline; cursor: pointer;
  }
  .repeat {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 10px; border-radius: 14px; border: 3px dashed var(--c);
    cursor: pointer; font-size: 1.05rem; user-select: none;
  }
  .repeat input { width: 24px; height: 24px; accent-color: var(--cd); cursor: pointer; }
  .card.done { background: #fbfff7; }
  .card.done .repeat { border-style: solid; background: var(--c); }

  /* 퀴즈 */
  .quiz {
    max-width: 560px; margin: 0 auto; background: #fff; border-radius: 26px;
    padding: 24px 20px; box-shadow: 0 6px 18px rgba(80, 60, 120, 0.12); text-align: center;
  }
  .quiz-head { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 8px; }
  .quiz svg { width: 170px; height: 170px; }
  .quiz .qtext { font-size: 1.45rem; margin: 10px 0 4px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .quiz .qko { color: var(--muted); margin-bottom: 16px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    font: inherit; font-size: 1.05rem; padding: 14px 8px; border-radius: 16px; cursor: pointer;
    border: 3px solid var(--purple); background: #fff; color: var(--ink);
  }
  .opt small { display: block; color: var(--muted); font-size: 0.85rem; }
  .opt:hover:not(:disabled) { background: var(--purple); }
  .opt.right { background: var(--green); border-color: var(--green-dark); }
  .opt.wrong { background: var(--pink); border-color: var(--pink-dark); }
  .opt:disabled { cursor: default; }
  .feedback { min-height: 60px; margin-top: 16px; font-size: 1.1rem; line-height: 1.5; }
  .feedback .ans { display: inline-flex; gap: 8px; align-items: center; font-weight: bold; }
  .main-btn {
    font: inherit; font-size: 1.1rem; padding: 12px 26px; border: none; border-radius: 16px;
    background: #ff9fb8; color: #fff; cursor: pointer; margin-top: 8px;
  }
  .main-btn:hover { background: #f5809f; }
  .result-big { font-size: 3rem; margin: 10px 0; }

  @media (max-width: 420px) {
    .options { grid-template-columns: 1fr; }
    .card-top svg { width: 72px; height: 72px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⏰ What time do you...?</h1>
    <p>5학년 영어 8단원 · 나의 하루 일과를 영어로 말해 봐요!</p>
  </header>

  <div class="bar mode">
    <button class="pill active" data-mode="cards">📇 카드 학습</button>
    <button class="pill" data-mode="quiz">🎯 퀴즈 학습</button>
  </div>

  <div class="bar tabs">
    <button class="pill active" data-cat="all">전체</button>
    <button class="pill" data-cat="textbook">📘 교과서 기본</button>
    <button class="pill" data-cat="korea">🇰🇷 한국 초등 일상</button>
    <button class="pill" data-cat="world">🌏 세계 초등 일상</button>
  </div>

  <div class="progress" id="progress"></div>

  <main id="cardsView" class="grid"></main>
  <main id="quizView" class="quiz" hidden></main>
</div>

<script>
  // routines.csv를 불러오지 못할 때(파일을 더블클릭해 열었을 때 등) 사용하는 기본 데이터
  const DEFAULT_CSV = `category,expression,korean,time,time_words,time_of_day,question,sentence,sentence_ko,tts_sentence
textbook,get up,일어나다,7:00,seven o'clock,in the morning,What time do you get up?,I get up at 7:00 in the morning.,나는 아침 7시에 일어나요.,I get up at seven o'clock in the morning.
textbook,go to school,학교에 가다,8:30,half past eight,in the morning,What time do you go to school?,I go to school at 8:30.,나는 8시 30분에 학교에 가요.,I go to school at half past eight.
textbook,have lunch,점심을 먹다,12:20,twelve twenty,at school,What time do you have lunch?,I have lunch at 12:20 at school.,나는 학교에서 12시 20분에 점심을 먹어요.,I have lunch at twelve twenty at school.
textbook,go home,집에 가다,2:45,quarter to three,in the afternoon,What time do you go home?,I go home at 2:45 in the afternoon.,나는 오후 2시 45분에 집에 가요.,I go home at quarter to three in the afternoon.
textbook,do homework,숙제를 하다,5:15,quarter past five,after school,What time do you do your homework?,I do my homework at 5:15 after school.,나는 방과 후 5시 15분에 숙제를 해요.,I do my homework at quarter past five after school.
textbook,go to bed,자러 가다,9:30,half past nine,at night,What time do you go to bed?,I go to bed at 9:30 at night.,나는 밤 9시 30분에 자러 가요.,I go to bed at half past nine at night.
korea,go to an academy,학원에 가다,4:30,four thirty,in the afternoon,What time do you go to an academy?,I go to an academy at 4:30 in the afternoon.,나는 오후 4시 30분에 학원에 가요.,I go to an academy at four thirty in the afternoon.
korea,play with friends,친구들과 놀다,3:15,quarter past three,after school,What time do you play with friends?,I play with friends at 3:15 after school.,나는 방과 후 3시 15분에 친구들과 놀아요.,I play with friends at quarter past three after school.
korea,walk the dog,강아지를 산책시키다,6:40,six forty,before dinner,What time do you walk the dog?,I walk the dog at 6:40 before dinner.,나는 저녁 먹기 전 6시 40분에 강아지를 산책시켜요.,I walk the dog at six forty before dinner.
korea,watch YouTube,유튜브를 보다,7:45,quarter to eight,after dinner,What time do you watch YouTube?,I watch YouTube at 7:45 after dinner.,나는 저녁 먹고 7시 45분에 유튜브를 봐요.,I watch YouTube at quarter to eight after dinner.
korea,pack my schoolbag,책가방을 싸다,8:50,ten to nine,before bed,What time do you pack your schoolbag?,I pack my schoolbag at 8:50 before bed.,나는 자기 전 8시 50분에 책가방을 싸요.,I pack my schoolbag at ten to nine before bed.
korea,go to taekwondo,태권도장에 가다,5:00,five o'clock,in the afternoon,What time do you go to taekwondo?,I go to taekwondo at 5:00 in the afternoon.,나는 오후 5시에 태권도장에 가요.,I go to taekwondo at five o'clock in the afternoon.
world,feed my pet,반려동물 밥을 주다,7:10,ten past seven,in the morning,What time do you feed your pet?,I feed my pet at 7:10 in the morning.,나는 아침 7시 10분에 반려동물 밥을 줘요.,I feed my pet at ten past seven in the morning.
world,take the school bus,스쿨버스를 타다,7:50,ten to eight,in the morning,What time do you take the school bus?,I take the school bus at 7:50 in the morning.,나는 아침 7시 50분에 스쿨버스를 타요.,I take the school bus at ten to eight in the morning.
world,practice soccer,축구를 연습하다,3:30,half past three,in the afternoon,What time do you practice soccer?,I practice soccer at 3:30 in the afternoon.,나는 오후 3시 30분에 축구를 연습해요.,I practice soccer at half past three in the afternoon.
world,practice the piano,피아노를 연습하다,4:00,four o'clock,after school,What time do you practice the piano?,I practice the piano at 4:00 after school.,나는 방과 후 4시에 피아노를 연습해요.,I practice the piano at four o'clock after school.
world,do chores,집안일을 돕다,6:00,six o'clock,before dinner,What time do you do chores?,I do chores at 6:00 before dinner.,나는 저녁 먹기 전 6시에 집안일을 도와요.,I do chores at six o'clock before dinner.
world,read before bed,잠들기 전 책을 읽다,8:45,quarter to nine,at night,What time do you read before bed?,I read before bed at 8:45 at night.,나는 밤 8시 45분에 잠들기 전 책을 읽어요.,I read before bed at quarter to nine at night.`;

  const CAT_LABEL = { textbook: "📘 교과서 기본", korea: "🇰🇷 한국 초등 일상", world: "🌏 세계 초등 일상" };
  const QUIZ_LENGTH = 10;

  let routines = [];
  let currentCat = "all";
  let currentMode = "cards";
  let quiz = null;

  // ---------- 따라 말하기 체크 (이 브라우저에 저장) ----------
  const CHECK_KEY = "daily-routine-checked";
  let checked = new Set();
  try { checked = new Set(JSON.parse(localStorage.getItem(CHECK_KEY) || "[]")); } catch (e) {}
  function saveChecked() {
    try { localStorage.setItem(CHECK_KEY, JSON.stringify([...checked])); } catch (e) {}
  }

  function renderProgress() {
    const list = filtered();
    const done = list.filter(r => checked.has(r.expression)).length;
    const all = done === list.length && list.length > 0;
    document.getElementById("progress").innerHTML = `
      <span class="count">${all ? "🏆 모두 따라 말했어요!" : "🗣️ 듣고 따라 말하기"} ✅ ${done} / ${list.length}</span>
      <button class="reset" id="resetChecks">체크 모두 지우기</button>`;
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const headers = rows.shift().map(h => h.trim());
    return rows
      .filter(r => r.some(v => v.trim()))
      .map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] || "").trim()])));
  }

  // ---------- 음성(TTS) ----------
  function speak(text) {
    if (!("speechSynthesis" in window)) {
      alert("이 브라우저는 음성 읽기를 지원하지 않아요. 크롬이나 엣지를 사용해 주세요.");
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang === "en-US") || voices.find(v => v.lang.startsWith("en"));
    if (voice) u.voice = voice;
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  if ("speechSynthesis" in window) speechSynthesis.getVoices(); // 목소리 목록 미리 불러오기

  // ---------- 아날로그 시계 ----------
  function clockSVG(time) {
    const [h, m] = time.split(":").map(Number);
    const minAngle = m * 6;
    const hourAngle = (h % 12) * 30 + m * 0.5;
    let ticks = "";
    for (let i = 0; i < 12; i++) {
      const big = i % 3 === 0;
      ticks += `<line x1="50" y1="${big ? 9 : 10}" x2="50" y2="${big ? 16 : 14}" stroke="#b9aee0" stroke-width="${big ? 3 : 2}" stroke-linecap="round" transform="rotate(${i * 30} 50 50)"/>`;
    }
    const nums = [[12, 50, 26], [3, 76, 54], [6, 50, 81], [9, 24, 54]]
      .map(([n, x, y]) => `<text x="${x}" y="${y}" font-size="10" text-anchor="middle" fill="#8b6fd6" font-family="sans-serif" font-weight="bold">${n}</text>`).join("");
    return `<svg viewBox="0 0 100 100" role="img" aria-label="${time}">
      <circle cx="50" cy="50" r="46" fill="#fffdf5" stroke="#e9dcff" stroke-width="6"/>
      ${ticks}${nums}
      <line x1="50" y1="50" x2="50" y2="30" stroke="#3b3553" stroke-width="5" stroke-linecap="round" transform="rotate(${hourAngle} 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="18" stroke="#ff8fab" stroke-width="3" stroke-linecap="round" transform="rotate(${minAngle} 50 50)"/>
      <circle cx="50" cy="50" r="4" fill="#3b3553"/>
    </svg>`;
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function filtered() {
    return currentCat === "all" ? routines : routines.filter(r => r.category === currentCat);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- 카드 학습 ----------
  function renderCards() {
    const view = document.getElementById("cardsView");
    view.innerHTML = filtered().map(r => `
      <article class="card${checked.has(r.expression) ? " done" : ""}" data-cat="${esc(r.category)}">
        <div class="card-top">
          ${clockSVG(r.time)}
          <div>
            <span class="badge">${CAT_LABEL[r.category] || esc(r.category)}</span>
            <button class="expr" data-say="${esc(r.expression)}" title="클릭하면 발음을 들을 수 있어요">${esc(r.expression)}</button>
            <div class="ko">${esc(r.korean)}</div>
          </div>
        </div>
        <div class="chips">
          <span class="chip t">🕐 ${esc(r.time)}</span>
          <span class="chip">${esc(r.time_words)}</span>
          <span class="chip">${esc(r.time_of_day)}</span>
        </div>
        <div class="talk">
          <div class="line">
            <span class="who q">Q</span>
            <span class="txt">${esc(r.question)}</span>
            <button class="spk" data-say="${esc(r.question)}" aria-label="질문 듣기">🔊</button>
          </div>
          <div class="line">
            <span class="who a">A</span>
            <span class="txt">${esc(r.sentence)}<small>${esc(r.sentence_ko)}</small></span>
            <button class="spk" data-say="${esc(r.tts_sentence || r.sentence)}" aria-label="대답 듣기">🔊</button>
          </div>
        </div>
        <label class="repeat">
          <input type="checkbox" class="check" data-expr="${esc(r.expression)}"${checked.has(r.expression) ? " checked" : ""}>
          듣고 따라 말했어요!
        </label>
      </article>`).join("");
    renderProgress();
  }

  // ---------- 대화 퀴즈 ----------
  function startQuiz() {
    // 퀴즈 학습은 카테고리와 상관없이 전체 표현에서 출제
    const pool = shuffle(routines).slice(0, QUIZ_LENGTH);
    quiz = { items: pool, index: 0, score: 0, answered: false };
    renderQuestion();
  }

  function renderQuestion() {
    const view = document.getElementById("quizView");
    const item = quiz.items[quiz.index];
    // 정답 1개 + 다른 일과의 시간 3개로 보기 만들기
    const others = shuffle(routines.filter(r => r.time !== item.time)).slice(0, 3);
    const options = shuffle([item, ...others]);

    view.innerHTML = `
      <div class="quiz-head">
        <span>문제 ${quiz.index + 1} / ${quiz.items.length}</span>
        <span>⭐ ${quiz.score}점</span>
      </div>
      ${clockSVG(item.time)}
      <div class="qtext">
        <span>${esc(item.question)}</span>
        <button class="spk" data-say="${esc(item.question)}" aria-label="질문 듣기">🔊</button>
      </div>
      <div class="qko">시계를 보고 알맞은 시간을 골라 대답해 보세요! (${esc(item.korean)})</div>
      <div class="options">
        ${options.map(o => `
          <button class="opt" data-time="${esc(o.time)}">
            ${esc(o.time_words)}<small>${esc(o.time)}</small>
          </button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>`;
    quiz.answered = false;
  }

  function answer(btn) {
    if (quiz.answered) return;
    quiz.answered = true;
    const item = quiz.items[quiz.index];
    const correct = btn.dataset.time === item.time;
    if (correct) quiz.score++;

    document.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      if (b.dataset.time === item.time) b.classList.add("right");
    });
    if (!correct) btn.classList.add("wrong");

    const last = quiz.index === quiz.items.length - 1;
    document.getElementById("feedback").innerHTML = `
      <div>${correct ? "🎉 정답이에요! 이렇게 대답해요:" : "😅 아쉬워요! 정답은:"}</div>
      <div class="ans">${esc(item.sentence)}
        <button class="spk" data-say="${esc(item.tts_sentence || item.sentence)}" aria-label="대답 듣기">🔊</button>
      </div>
      <div><button class="main-btn" id="nextQ">${last ? "결과 보기 🏆" : "다음 문제 ▶"}</button></div>`;
    document.querySelector(".quiz-head span:last-child").textContent = `⭐ ${quiz.score}점`;
    speak(item.tts_sentence || item.sentence);
  }

  function renderResult() {
    const total = quiz.items.length;
    const msg = quiz.score === total ? "완벽해요! 시간 박사님! 🏅"
      : quiz.score >= total * 0.7 ? "아주 잘했어요! 👏"
      : "조금만 더 연습해 봐요! 💪";
    document.getElementById("quizView").innerHTML = `
      <h2>퀴즈 끝!</h2>
      <div class="result-big">${quiz.score} / ${total}</div>
      <p>${msg}</p>
      <button class="main-btn" id="restartQ">🔁 다시 하기</button>`;
  }

  function render() {
    const cards = document.getElementById("cardsView");
    const quizView = document.getElementById("quizView");
    const isQuiz = currentMode === "quiz";
    // 퀴즈 학습에서는 카테고리 탭·카드·체크 현황을 숨기고 퀴즈 화면만 보여줌
    cards.hidden = isQuiz;
    document.querySelector(".tabs").hidden = isQuiz;
    document.getElementById("progress").hidden = isQuiz;
    quizView.hidden = !isQuiz;
    if (currentMode === "cards") renderCards(); else startQuiz();
  }

  // ---------- 이벤트 ----------
  document.querySelector(".mode").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]");
    if (!b) return;
    document.querySelectorAll(".mode .pill").forEach(p => p.classList.toggle("active", p === b));
    currentMode = b.dataset.mode;
    render();
  });

  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    document.querySelectorAll(".tabs .pill").forEach(p => p.classList.toggle("active", p === b));
    currentCat = b.dataset.cat;
    render();
  });

  document.addEventListener("click", e => {
    const sayBtn = e.target.closest("[data-say]");
    if (sayBtn) { speak(sayBtn.dataset.say); return; }
    const opt = e.target.closest(".opt");
    if (opt) { answer(opt); return; }
    if (e.target.id === "nextQ") {
      quiz.index++;
      if (quiz.index < quiz.items.length) renderQuestion(); else renderResult();
    }
    if (e.target.id === "restartQ") startQuiz();
    if (e.target.id === "resetChecks") {
      checked.clear();
      saveChecked();
      renderCards();
    }
  });

  document.addEventListener("change", e => {
    if (!e.target.classList.contains("check")) return;
    const expr = e.target.dataset.expr;
    if (e.target.checked) checked.add(expr); else checked.delete(expr);
    saveChecked();
    e.target.closest(".card").classList.toggle("done", e.target.checked);
    renderProgress();
  });

  // 같은 폴더의 routines.csv를 먼저 시도하고, 실패하면 기본 데이터 사용
  fetch("routines.csv")
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(text => { routines = parseCSV(text); })
    .catch(() => { routines = parseCSV(DEFAULT_CSV); })
    .finally(render);
</script>
</body>
</html>
